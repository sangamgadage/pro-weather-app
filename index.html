!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1424;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    .weather-card {
      background: #192233;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      background: #25334d;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-box button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #0d1424;
      font-weight: bold;
      cursor: pointer;
    }
    .quick-cities {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .city-badge {
      background: #25334d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
    }
    .action-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .action-btn {
      background: #25334d;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .main-weather {
      text-align: center;
      margin-bottom: 15px;
    }
    .main-weather h2 {
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .main-weather .temp {
      font-size: 54px;
      font-weight: bold;
      margin: 10px 0;
    }
    .main-weather .desc {
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 15px;
    }
    .voice-btn {
      background: #a855f7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-card {
      background: #25334d;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
    .detail-card span {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      display: block;
      margin-bottom: 5px;
    }
    .detail-card p {
      font-size: 16px;
      font-weight: bold;
    }
    .section-card {
      background: #25334d;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .section-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .forecast-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #192233;
      font-size: 14px;
    }
    .forecast-row:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <!-- Search Bar -->
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search city...">
      <button onclick="getWeatherByInput()">Search</button>
    </div>

    <!-- Quick Recent Cities -->
    <div class="quick-cities" id="recentCities">
      <span class="city-badge" onclick="fetchWeatherData('Pune')">Pune</span>
      <span class="city-badge" onclick="fetchWeatherData('Mumbai')">Mumbai</span>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="action-btn" onclick="getLocationWeather()">📍 GPS Location</button>
      <button class="action-btn" onclick="toggleTempUnit()">🌡️ °C / °F</button>
    </div>

    <!-- Main Temp Info -->
    <div class="main-weather">
      <h2 id="cityName">Mumbai, IN</h2>
      <div class="temp" id="temp">28°C</div>
      <div class="desc" id="weatherDesc">Light Rain</div>
      <button class="voice-btn" onclick="speakWeather()">🔊 Voice Report</button>
    </div>

    <!-- Air Quality & Weather Details -->
    <div class="details-grid">
      <div class="detail-card">
        <span>AIR QUALITY</span>
        <p id="aqi">1 - Good 🌿</p>
      </div>
      <div class="detail-card">
        <span>FEELS LIKE</span>
        <p id="feelsLike">32°C</p>
      </div>
      <div class="detail-card">
        <span>HUMIDITY</span>
        <p id="humidity">80%</p>
      </div>
      <div class="detail-card">
        <span>WIND</span>
        <p id="wind">9.2 km/h</p>
      </div>
    </div>

    <!-- 24 Hour Temp Placeholder Graph -->
    <div class="section-card">
      <div class="section-title">24-Hour Temp Graph</div>
      <div style="text-align: center; padding: 20px 0; color: #38bdf8;">
        📈 [Graph View Active]
      </div>
    </div>

    <!-- 5 Day Forecast -->
    <div class="section-card">
      <div class="section-title">5-Day Forecast</div>
      <div class="forecast-row"><span>Mon</span><span>Rain</span><b>28°C</b></div>
      <div class="forecast-row"><span>Tue</span><span>Clouds</span><b>30°C</b></div>
      <div class="forecast-row"><span>Wed</span><span>Clear</span><b>32°C</b></div>
    </div>
  </div>

  <!-- Total Page Views Counter -->
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin: 20px 0; text-align: center;">
    <p style="color: #ffffff; margin-bottom: 8px; font-size: 14px;">Total Page Views</p>
    <img src="https://api.visitorbadge.io/api/visitors?path=live-weather-app-fast.netlify.app&label=Views&countColor=%23263759" alt="Views Counter" />
  </div>

  <!-- Creator Name -->
  <p style="text-align: center; color: #ffffff; font-size: 14px; margin-top: 10px;">
    Created by <b>Sangmeshwar Gadage</b>
  </p>

  <!-- Action Buttons (Share & Install) -->
  <div style="display: flex; gap: 10px; justify-content: center; margin: 20px 0;">
    <button id="shareBtn" onclick="shareWeather()" style="background: #25D366; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;">
      📤 Share Weather
    </button>
    <button id="installBtn" onclick="installApp()" style="background: #0088cc; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;">
      📲 Install App
    </button>
  </div>

  <script>
    // Search City
    function getWeatherByInput() {
      const city = document.getElementById("cityInput").value.trim();
      if (city) {
        fetchWeatherData(city);
      } else {
        alert("Please enter a city name!");
      }
    }

    // Fetch Weather Mock Function
    function fetchWeatherData(city) {
      document.getElementById("cityName").innerText = city.toUpperCase() + ", IN";
      document.getElementById("temp").innerText = "28°C";
      document.getElementById("weatherDesc").innerText = "Clear Sky";
    }

    // Voice Report Function
    function speakWeather() {
      const city = document.getElementById("cityName").innerText;
      const temp = document.getElementById("temp").innerText;
      const desc = document.getElementById("weatherDesc").innerText;
      const text = `Current weather in ${city} is ${desc} with a temperature of ${temp}`;
      
      const speech = new SpeechSynthesisUtterance(text);
      window.speechSynthesis.speak(speech);
    }

    // Share Weather Function
    function shareWeather() {
      const city = document.getElementById("cityName").innerText;
      const temp = document.getElementById("temp").innerText;
      const shareText = `🌤️ Live Weather Update for ${city}: ${temp}! Check live weather here: ${window.location.href}`;

      if (navigator.share) {
        navigator.share({ title: 'Live Weather App', text: shareText, url: window.location.href });
      } else {
        navigator.clipboard.writeText(shareText);
        alert("Weather details copied to clipboard!");
      }
    }

    // PWA Install App Function
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      } else {
        alert("इसे इंस्टॉल करने के लिए Chrome के 3-dots (⋮) पर क्लिक करें और 'Add to Home screen' या 'Install app' चुनें!");
      }
    }
  </script>
</body>
</html>
